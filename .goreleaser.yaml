version: 2

project_name: lokid

before:
  hooks:
    - go mod download

builds:
  # appVersion is a plain var in each main package precisely so it can be set
  # here; there are no hand-edited version constants left to drift out of step
  # with the released tag. appBuild keeps the short commit, as the previous
  # release tooling did.
  - id: lokid
    main: .
    binary: lokid
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.appVersion={{ .Version }} -X main.appBuild={{ .ShortCommit }}
    targets: &targets
      - darwin_amd64
      - darwin_arm64
      - dragonfly_amd64
      - freebsd_386
      - freebsd_amd64
      - freebsd_arm_6
      - illumos_amd64
      - linux_386
      - linux_amd64
      - linux_arm64
      - linux_mips
      - linux_mips64
      - linux_mips64le
      - linux_mipsle
      - linux_ppc64
      - linux_ppc64le
      - netbsd_386
      - netbsd_amd64
      - netbsd_arm_6
      - netbsd_arm64
      - openbsd_386
      - openbsd_amd64
      - openbsd_arm_6
      - openbsd_arm64
      - solaris_amd64
      - windows_386
      - windows_amd64

  - id: lokid-cli
    main: ./cmd/lokid-cli
    binary: lokid-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.appVersion={{ .Version }} -X main.appBuild={{ .ShortCommit }}
    targets: *targets

archives:
  # One archive per platform carrying both binaries, matching the asset names
  # the previous tooling produced so existing download URLs keep their shape:
  # lokid-<os>-<arch>-v<version>.tar.gz (.zip on Windows).
  - id: lokid
    ids:
      - lokid
      - lokid-cli
    name_template: "lokid-{{ .Os }}-{{ .Arch }}-v{{ .Version }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE

checksum:
  name_template: checksums.txt

release:
  github:
    owner: flokiorg
    name: go-flokicoin
  # Re-running a release replaces the assets rather than erroring.
  mode: replace
  # A version with a pre-release suffix is published as a GitHub prerelease.
  prerelease: auto

# Deliberately no `changelog:` block. GoReleaser loads --release-notes through
# the same pipe it uses for changelog generation, so disabling that pipe
# silently publishes an empty release body. The notes come from CHANGELOG.md via
# --release-notes in .github/workflows/release.yml.
